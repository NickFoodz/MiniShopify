<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <title>Merchant Registration</title>
</head>
<body>

<h2>Merchant Registration</h2>

<p>
  <a href="/gui/register">Back to Login</a> |
</p>

<form th:action="@{/gui/register/merchant}" th:object="${merchant}" method="post">

  <label>Name:</label>
  <input type="text" th:field="*{name}" required /><br/>

  <label>Email:</label>
  <input type="email" th:field="*{email}" required /><br/>

  <label>Password:</label>
  <input type="password" th:field="*{password}" required /><br/>

  <button type="submit">Register</button>
</form>

</body>
</html>
