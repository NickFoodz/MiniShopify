<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      lang="en-US">
<head>
    <meta charset="UTF-8">
    <title>Shops</title>

<!--    <link rel="stylesheet" href="/css/styles.css">-->
</head>
<body>
<div class="container">
    <h1>All Shops</h1>

    <a href="/gui/">Back to Home</a>
    <span sec:authorize="hasRole('CUSTOMER')"> | <a href="/gui/customer/cart">My Cart</a></span>
    <hr>

    <!-- Success/Error Messages -->
    <div th:if="${message}" class="alert alert-success">
        <p th:text="${message}"></p>
    </div>
    <div th:if="${error}" class="alert alert-error">
        <p th:text="${error}"></p>
    </div>
    <span sec:authorize="hasRole('MERCHANT')">
        <form th:action="@{/gui/shops}" method="post">
            <input type="text" name="name" placeholder="Shop name" required>
            <button type="submit">Add Shop</button>
        </form>
    </span>

    <ul>
        <li th:each="shop : ${shops}">
            <a th:href="@{'/gui/shops/' + ${shop.id}}">
                <span th:text="'Shop Name: ' + ${shop.name} + ', Shop ID: ' + ${shop.id}"></span>
            </a>
            <span sec:authorize="hasRole('MERCHANT')">
            <form th:action="@{/gui/remove-shop}" method="post" style="display:inline;">
                <input type="hidden" name="shopId" th:value="${shop.id}">
                <button type="submit" class="btn-danger">Remove Shop</button>
            </form>
        </span>
            <ul>
                <li th:each="product : ${shop.products}">
                    <span th:text="${product.name} + ', ProductID: ' + ${product.id} +', Stock:' + ${product.stock} + ', Price: $' + ${product.price}"></span>

                    <!-- Add to Cart button for customers only -->
                    <span sec:authorize="hasRole('CUSTOMER')">
                    <form th:action="@{/gui/customer/cart/add}" method="post" style="display:inline;">
                        <input type="hidden" name="productId" th:value="${product.id}">
                        <input type="hidden" name="quantity" value="1">
                        <button type="submit" th:disabled="${product.stock == 0}">
                            <span th:text="${product.stock > 0 ? 'Add to Cart' : 'Out of Stock'}">Add to Cart</span>
                        </button>
                    </form>
                </span>

                    <span sec:authorize="hasRole('MERCHANT')">
                    <form th:action="@{/gui/remove-product}" method="post" style="display:inline;">
                        <input type="hidden" name="productId" th:value="${product.id}">
                        <input type="hidden" name="shopId" th:value="${shop.id}">
                        <button type="submit" class="btn-danger">Remove Product</button>
                    </form>
                </span>
                </li>
            </ul>
        </li>
    </ul>
</div>
</body>
</html>
