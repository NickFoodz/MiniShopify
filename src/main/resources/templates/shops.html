<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Shops</title>
</head>
<body>
<h1>All Shops</h1>

<a href="/gui/">Back to Home</a>
<hr>

<form th:action="@{/gui/shops}" method="post">
    <input type="text" name="name" placeholder="Shop name" required>
    <button type="submit">Add Shop</button>
</form>

<ul>
    <li th:each="shop : ${shops}">
        <span th:text="'Shop ID: ' + ${shop.id}"></span>
        <ul>
            <li th:each="product : ${shop.products}" th:text="${product.name}"></li>
        </ul>
    </li>
</ul>
</body>
</html>
