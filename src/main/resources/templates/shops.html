<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      lang="en-US">
<head>
    <meta charset="UTF-8">
    <title>Shops</title>
    <link rel="stylesheet" href="/css/styles.css">
    <style>
        /* Shop cards styling */
        .shops-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 25px;
            margin-top: 20px;
        }

        .shop-card {
            background: var(--bg-white);
            border-radius: var(--border-radius);
            padding: 25px;
            box-shadow: var(--shadow-md);
            transition: var(--transition);
            border: 2px solid transparent;
        }

        .shop-card:hover {
            transform: translateY(-3px);
            box-shadow: var(--shadow-lg);
            border-color: var(--primary);
        }

        .shop-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            padding-bottom: 15px;
            border-bottom: 2px solid var(--border-light);
        }

        .shop-name {
            font-size: 1.5em;
            font-weight: 700;
            color: var(--text-dark);
        }

        .shop-id {
            color: var(--text-muted);
            font-size: 0.9em;
        }

        .product-list {
            list-style: none;
            padding: 0;
            margin: 15px 0;
        }

        .product-item {
            padding: 12px;
            margin: 8px 0;
            background: var(--bg-light);
            border-radius: var(--border-radius-sm);
            display: flex;
            align-items: center;
            gap: 15px;
            transition: var(--transition);
        }

        .product-item:hover {
            background: var(--bg-section);
            transform: translateX(5px);
        }

        .product-thumbnail {
            width: 50px;
            height: 50px;
            object-fit: cover;
            border-radius: var(--border-radius-sm);
            flex-shrink: 0;
        }

        .product-info {
            flex: 1;
        }

        .product-name-text {
            font-weight: 600;
            color: var(--text-dark);
            margin-bottom: 3px;
        }

        .product-details {
            font-size: 0.85em;
            color: var(--text-muted);
        }

        /* Sort control for each shop */
        .shop-sort-control {
            background: var(--bg-light);
            padding: 10px;
            border-radius: var(--border-radius-sm);
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 0.9em;
        }

        .shop-sort-control label {
            font-weight: 600;
            margin: 0;
        }

        .shop-sort-control select {
            flex: 1;
            padding: 6px 10px;
            border-radius: var(--border-radius-sm);
            border: 2px solid var(--border-color);
            cursor: pointer;
            font-size: 0.9em;
        }

        .product-list {
            list-style: none;
            padding: 0;
            margin: 15px 0;
        }

        .product-item {
            padding: 12px;
            margin: 8px 0;
            background: var(--bg-light);
            border-radius: var(--border-radius-sm);
            display: flex;
            align-items: center;
            gap: 15px;
            transition: var(--transition);
        }

        .product-item:hover {
            background: var(--bg-section);
            transform: translateX(5px);
        }

        .product-thumbnail {
            width: 50px;
            height: 50px;
            object-fit: cover;
            border-radius: var(--border-radius-sm);
            flex-shrink: 0;
        }

        .product-info {
            flex: 1;
        }

        .product-name-text {
            font-weight: 600;
            color: var(--text-dark);
            margin-bottom: 3px;
        }

        .product-details {
            font-size: 0.85em;
            color: var(--text-muted);
        }

        /* Stock status indicators */
        .stock-indicator {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            padding: 4px 10px;
            border-radius: 15px;
            font-size: 0.8em;
            font-weight: 600;
            margin-left: 8px;
        }

        .stock-indicator.high {
            background: #d4edda;
            color: #155724;
        }

        .stock-indicator.low {
            background: #fff3cd;
            color: #856404;
        }

        .stock-indicator.out {
            background: #f8d7da;
            color: #721c24;
        }

        .stock-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            display: inline-block;
        }

        .stock-dot.high {
            background: #28a745;
        }

        .stock-dot.low {
            background: #ffc107;
        }

        .stock-dot.out {
            background: #dc3545;
        }

        .no-products {
            text-align: center;
            color: var(--text-muted);
            padding: 20px;
            font-style: italic;
        }
    </style>
</head>
<body>
<div class="container">
    <h1>All Shops</h1>

    <nav>
        <a href="/gui/">Back to Home</a> |
        <span sec:authorize="hasRole('CUSTOMER')">
            <a href="/gui/customer/cart">My Cart</a>
        </span>
        <span sec:authorize="hasRole('CUSTOMER')"> | </span>
        <a href="/gui/search">Search Products</a>
    </nav>

    <!-- Success/Error Messages -->
    <div th:if="${message}" class="alert alert-success">
        <p th:text="${message}"></p>
    </div>
    <div th:if="${error}" class="alert alert-error">
        <p th:text="${error}"></p>
    </div>

    <!-- Search shops -->
    <form th:action="@{/gui/shops}" method="get" style="margin: 15px 0;">
        <div style="display:flex; gap:10px; align-items:center;">
            <input type="text"
                   name="q"
                   placeholder="Search shops by name..."
                   th:value="${q}"
                   style="flex:1; padding:10px 12px; border:1px solid var(--border-light);
                      border-radius: var(--border-radius-sm); font-size:1em;" />

            <button type="submit" class="btn btn-primary">Search</button>

            <a th:href="@{/gui/shops}" class="btn btn-secondary">Clear</a>
        </div>
    </form>

    <!-- Shops Grid -->
    <div class="shops-grid">
        <div class="shop-card" th:each="shop : ${shops}">
            <!-- Shop Header -->
            <div class="shop-header">
                <div>
                    <a th:href="@{/gui/shop/{id}(id=${shop.id})}" >
                        <div class="shop-name" th:text="${shop.name}">Shop Name</div>
                        <div class="shop-id">ID: <span th:text="${shop.id}">1</span></div>
                    </a>

                </div>
            </div>

            <!-- Sort Control for This Shop -->
            <div class="shop-sort-control" th:if="${!#lists.isEmpty(shop.products)}">
                <label th:for="'sort-' + ${shop.id}">Sort:</label>
                <select th:id="'sort-' + ${shop.id}"
                        th:onchange="'sortShop(' + ${shop.id} + ', this.value)'">
                    <option value="name-asc"
                            th:selected="${sortMap.get(shop.id.toString()) == 'name-asc' or sortMap.get(shop.id.toString()) == null}">
                        Name (A-Z)
                    </option>
                    <option value="name-desc"
                            th:selected="${sortMap.get(shop.id.toString()) == 'name-desc'}">
                        Name (Z-A)
                    </option>
                    <option value="price-asc"
                            th:selected="${sortMap.get(shop.id.toString()) == 'price-asc'}">
                        Price (Low to High)
                    </option>
                    <option value="price-desc"
                            th:selected="${sortMap.get(shop.id.toString()) == 'price-desc'}">
                        Price (High to Low)
                    </option>
                    <option value="stock"
                            th:selected="${sortMap.get(shop.id.toString()) == 'stock'}">
                        Stock (High to Low)
                    </option>
                </select>
            </div>

            <!-- Products List -->
            <div th:if="${!#lists.isEmpty(shop.products)}">
                <h4 style="margin-bottom: 10px; color: var(--text-dark);">
                    Products (<span th:text="${#lists.size(shop.products)}">0</span>)
                </h4>
                <ul class="product-list">
                    <li class="product-item" th:each="product : ${shop.products}">
                        <img th:src="${product.imageUrl}"
                             alt="Product"
                             class="product-thumbnail"
                             onerror="this.src='https://upload.wikimedia.org/wikipedia/commons/1/14/No_Image_Available.jpg'">

                        <div class="product-info">
                            <div class="product-name-text" th:text="${product.name}">Product Name</div>
                            <div class="product-details">
                                <strong>$<span th:text="${#numbers.formatDecimal(product.price, 1, 2)}">0.00</span></strong>

                                <!-- Stock Indicator -->
                                <span class="stock-indicator"
                                      th:classappend="${product.stock == 0} ? 'out' : (${product.stock <= 10} ? 'low' : 'high')">
                                    <span class="stock-dot"
                                          th:classappend="${product.stock == 0} ? 'out' : (${product.stock <= 10} ? 'low' : 'high')">
                                    </span>
                                    <span th:text="${product.stock == 0} ? 'Out of Stock' :
                                                   (${product.stock <= 10} ? 'Only ' + ${product.stock} + ' left!' :
                                                   ${product.stock} + ' in stock')">
                                        Stock
                                    </span>
                                </span>
                            </div>
                        </div>

                        <!-- Add to Cart (Customer Only) -->
                        <span sec:authorize="hasRole('CUSTOMER')">
                            <form th:action="@{/gui/customer/cart/add}" method="post" style="display:inline;">
                                <input type="hidden" name="productId" th:value="${product.id}">
                                <input type="hidden" name="quantity" value="1">
                                <button type="submit"
                                        class="btn btn-small btn-primary"
                                        th:disabled="${product.stock == 0}">
                                    <span th:text="${product.stock > 0 ? 'Add to Cart' : 'Out of Stock'}">Add to Cart</span>
                                </button>
                            </form>
                        </span>
                    </li>
                </ul>
            </div>

            <!-- No Products State -->
            <div th:if="${#lists.isEmpty(shop.products)}" class="no-products">
                No products available in this shop yet
            </div>
        </div>
    </div>

    <!-- Empty State -->
    <div th:if="${#lists.isEmpty(shops)}" class="section" style="text-align: center;">
        <h3>No Shops Available</h3>
        <p>There are currently no shops in the system.</p>
        <p sec:authorize="hasRole('MERCHANT')">Use the form above to create your first shop!</p>
    </div>
</div>
<script>
    function sortShop(shopId, sortBy) {
        // Build URL with all current sort parameters
        const url = new URL(window.location.href);
        url.searchParams.set(shopId.toString(), sortBy);
        window.location.href = url.toString();
    }
</script>
</body>
</html>
