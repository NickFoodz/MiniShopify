<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>MiniShopify</title>

    <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
<div class="container">
    <h1>MiniShopify Dashboard</h1>

    <nav>
        <a href="/gui/shops">View Shops</a> |
        <a href="/gui/add-product" sec:authorize="hasRole('MERCHANT')">Add Product</a>
        <span sec:authorize="hasRole('MERCHANT')"> | </span>
        <a href="/gui/search">Search Products</a> |
        <a href="/gui/login">Login/Dashboard</a> |
        <a th:href="@{/gui/customer/cart}" sec:authorize="hasRole('CUSTOMER')">My Cart</a>
        <span sec:authorize="hasRole('CUSTOMER')"> | </span>

        <form th:action="@{/gui/logout}" method="post" style="display: inline;">
            <button type="submit" class="btn btn-secondary" style="padding: 8px 16px; font-size: 0.9em;">
                Logout
            </button>
        </form>
    </nav>

    <hr>

    <h2>Welcome</h2>
    <p>Use the links above to manage your shops and products.</p>
</div>
</body>
</html>
