<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout - MiniShopify</title>

    <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
<div class="container">
    <h1>Checkout</h1>

    <nav>
        <a href="/gui/">Home</a> |
        <a href="/gui/shops">Continue Shopping</a> |
        <a href="/gui/customer/cart">Back to Cart</a>
    </nav>

    <hr>

    <!-- Error Messages -->
    <div th:if="${error}" class="alert alert-error">
        <p th:text="${error}"></p>
    </div>

    <form th:action="@{/gui/customer/checkout/process}" method="post">
        <div class="checkout-grid">
            <!-- Left Column: Customer & Payment Info -->
            <div>
                <!-- Shipping Information -->
                <div class="section">
                    <h2>Shipping Information</h2>

                    <div class="form-group">
                        <label>Full Name <span class="required">*</span></label>
                        <input type="text" name="fullName"
                               th:value="${customer.name}" required>
                    </div>

                    <div class="form-group">
                        <label>Email <span class="required">*</span></label>
                        <input type="email" name="email"
                               th:value="${customer.email}" required>
                    </div>

                    <div class="form-group">
                        <label>Address <span class="required">*</span></label>
                        <input type="text" name="address"
                               placeholder="123 Main St" required>
                    </div>

                    <div class="form-group">
                        <label>City <span class="required">*</span></label>
                        <input type="text" name="city"
                               placeholder="Ottawa" required>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label>Province <span class="required">*</span></label>
                            <input type="text" name="province"
                                   placeholder="ON" required>
                        </div>
                        <div class="form-group">
                            <label>Postal Code <span class="required">*</span></label>
                            <input type="text" name="postalCode"
                                   placeholder="K1A 0B1" required>
                        </div>
                    </div>
                </div>

                <!-- Payment Information -->
                <div class="section">
                    <h2>Payment Information</h2>

                    <div class="form-group">
                        <label>Card Number <span class="required">*</span></label>
                        <input type="text" name="cardNumber"
                               placeholder="1234 5678 9012 3456"
                               maxlength="19" required>
                    </div>

                    <div class="form-group">
                        <label>Cardholder Name <span class="required">*</span></label>
                        <input type="text" name="cardName"
                               placeholder="Name on Card" required>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label>Expiry Date <span class="required">*</span></label>
                            <input type="text" name="expiryDate"
                                   placeholder="MM/YY"
                                   maxlength="5" required>
                        </div>
                        <div class="form-group">
                            <label>CVV <span class="required">*</span></label>
                            <input type="text" name="cvv"
                                   placeholder="123"
                                   maxlength="4" required>
                        </div>
                    </div>
                </div>

                <button type="submit" class="btn btn-primary btn-large">
                    Complete Order
                </button>
            </div>

            <!-- Right Column: Order Summary -->
            <div>
                <div class="section order-summary">
                    <h2>Order Summary</h2>

                    <div class="cart-items">
                        <div th:each="item : ${cartItems}" class="cart-item">
                            <div class="item-details">
                                <div class="item-name" th:text="${item.product.name}">Product</div>
                                <div class="item-quantity">
                                    Qty: <span th:text="${item.quantity}">1</span> ×
                                    $<span th:text="${#numbers.formatDecimal(item.product.price, 1, 2)}">0.00</span>
                                </div>
                            </div>
                            <div class="item-price">
                                $<span th:text="${#numbers.formatDecimal(item.product.price * item.quantity, 1, 2)}">0.00</span>
                            </div>
                        </div>
                    </div>

                    <div class="totals">
                        <div class="total-row">
                            <span>Subtotal:</span>
                            <span>$<span th:text="${#numbers.formatDecimal(subtotal, 1, 2)}">0.00</span></span>
                        </div>
                        <div class="total-row">
                            <span>Tax (13%):</span>
                            <span>$<span th:text="${#numbers.formatDecimal(tax, 1, 2)}">0.00</span></span>
                        </div>
                        <div class="total-row grand-total">
                            <span>Total:</span>
                            <span>$<span th:text="${#numbers.formatDecimal(grandTotal, 1, 2)}">0.00</span></span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </form>
</div>
</body>
</html>
