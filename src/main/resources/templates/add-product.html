<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Add Product</title>

    <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
<div class="container">
    <h1>Add a Product</h1>

    <a href="/gui/">Back to Home</a>
    <hr>

    <form th:action="@{/gui/add-product}" method="post">
        <label>Name:</label>
        <input type="text" name="name" required><br>

        <label>Shop ID:</label>
        <input type="number" name="shopID" required><br>

        <label>Description:</label>
        <input type="text" name="description"><br>

        <label>Price:</label>
        <input type="number" name="price" step="0.01" required><br>

        <label>Stock:</label>
        <input type="number" name="stock" required><br>

        <label>Image URL (optional):</label>
        <input type="text" name="imageUrl" placeholder="Enter image URL or leave blank for default"><br>

        <button type="submit">Add Product</button>
    </form>
</div>
</body>
</html>
